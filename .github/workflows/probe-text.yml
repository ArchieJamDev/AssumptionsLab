name: Sonda temporal del elemento Text

on:
  push:
    branches: [ 'claude/project-thread-6r9uwr' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Versiones
        run: |
          Rscript -e "install.packages(c('jmvtools','jmvcore'), repos = c('https://repo.jamovi.org', 'https://cloud.r-project.org'))"
          Rscript -e "print(packageVersion('jmvtools')); print(packageVersion('jmvcore')); print(exists('Text', envir=asNamespace('jmvcore'))); print(available.packages(repos='https://repo.jamovi.org')[,c('Package','Version')])"
          Rscript -e "print(available.packages(repos='https://cloud.r-project.org')['jmvcore','Version'])"
      - name: prepare con Text
        run: |
          cp -r .github/probe /tmp/probe && cd /tmp/probe && Rscript -e "jmvtools::prepare()" ; cat R/*.h.R | grep -n -i -B2 -A12 "text" | head -80
