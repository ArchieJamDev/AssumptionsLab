name: Sonda temporal del elemento Text

on:
  push:
    branches: [ 'claude/project-thread-6r9uwr' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Instalar
        run: Rscript -e "install.packages(c('jmvtools','jmvcore'), repos = c('https://repo.jamovi.org', 'https://cloud.r-project.org'))"
      - name: Fuentes
        run: |
          Rscript -e "print(jmvtools::prepare); print(jmvtools:::.compile %||% NULL)" || true
          Rscript -e "print(ls(asNamespace('jmvtools'), all.names=TRUE))"
          Rscript -e "T <- jmvcore::Text; print(T); print(T\$public_methods\$initialize); print(names(T\$public_methods)); print(T\$public_methods\$asProtoBuf); print(T\$public_methods\$setContent)"
          ls -R $(Rscript -e "cat(system.file(package='jmvtools'))") | head -60
      - name: Compilar a mano
        run: |
          cp -r .github/probe /tmp/probe && cd /tmp/probe
          J=$(Rscript -e "cat(system.file(package='jmvtools'))")
          find $J -name "*.js" -path "*compiler*" | head -5
          C=$(find $J -name index.js -path "*compiler*" | head -1)
          N=$(find $J -type f -name node | head -1)
          echo "node=$N compiler=$C"
          $N $C --help || true
          $N $C --prepare . --home /nonexistent || $N $C --prepare . || true
          ls R; cat R/*.h.R | head -150
