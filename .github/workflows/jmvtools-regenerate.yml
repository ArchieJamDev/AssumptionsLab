name: Regenerar archivos de jamovi

# One-off helper for the second jamovi review: runs jmvtools::i18nUpdate("es")
# on the branch, recompiles inst/i18n/es.json and commits whatever changed.
# Removed again before the PR is merged.
# ES: Ayudante puntual; se retira antes de fusionar.

on:
  push:
    branches: [ 'claude/project-thread-6r9uwr' ]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Instalar jmvtools
        run: Rscript -e "install.packages('jmvtools', repos = c('https://repo.jamovi.org', 'https://cloud.r-project.org'))"
      - name: jmvtools::i18nUpdate("es")
        run: Rscript -e "jmvtools::i18nUpdate('es')"
      - name: Compilar es.json
        run: python3 .github/scripts/po_to_json.py es
      - name: Cadenas sin traducir
        run: |
          python3 - <<'PY'
          import re
          t = open('jamovi/i18n/es.po', encoding='utf-8').read()
          blocks = t.split('\n\n')
          empty = [b for b in blocks if re.search(r'^msgstr ""\s*$', b, re.M) and not re.search(r'^msgstr ""\n"', b, re.M) and 'msgid ""\nmsgstr ""\n"' not in b]
          print(len(empty), 'untranslated')
          for b in empty[:80]: print(b, '\n')
          PY
      - name: Cambios
        run: |
          git status --short
          git diff --stat
      - name: Confirmar los archivos regenerados
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Regenerar es.po con jmvtools::i18nUpdate(\"es\")"
            git push origin HEAD:${{ github.ref_name }}
          fi
