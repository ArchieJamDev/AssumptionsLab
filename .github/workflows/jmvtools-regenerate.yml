name: Regenerar archivos de jamovi

# One-off helper for PR #14: runs jmvtools::prepare() and
# jmvtools::i18nUpdate("es") on the branch, recompiles inst/i18n/es.json,
# commits whatever changed back to the branch and checks the bibliography
# DOIs against Crossref.
# ES: Ayudante puntual para el PR #14.

on:
  push:
    branches: [ 'claude/project-thread-igtwu6' ]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Instalar jmvtools
        run: Rscript -e "install.packages('jmvtools', repos = c('https://repo.jamovi.org', 'https://cloud.r-project.org'))"

      - name: jmvtools::prepare()
        run: Rscript -e "jmvtools::prepare()"

      - name: jmvtools::i18nUpdate("es")
        run: Rscript -e "jmvtools::i18nUpdate('es')"

      - name: Compilar es.json
        run: python3 .github/scripts/po_to_json.py es

      - name: Cambios
        run: |
          git status --short
          git diff --stat
          git diff -- jamovi/i18n/es.po | grep -E '^[+-]msg' | head -200 || true
          git diff -- R/ | head -400 || true

      - name: Confirmar los archivos regenerados
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Regenerar con jmvtools::prepare() e i18nUpdate(\"es\")"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Sin cambios: los archivos coinciden con lo que genera jmvtools."
          fi

      - name: Comprobar DOI en Crossref
        if: always()
        run: .github/scripts/check_dois.sh
