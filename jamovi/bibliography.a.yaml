name: bibliography
title: Bibliography
menuTitle: Bibliography
menuGroup: Assumption Lab
menuSubgroup: Methodological Guide
version: '1.0.0'
jas: '1.2'
options:
  # Required anchor dataset. Bibliography is a reference browser, not a
  # data analysis: it never reads any variable from this dataset, but
  # jamovi requires every analysis to be attached to one before it will run.
  # ES: Conjunto de datos ancla requerido. Bibliography es un explorador de
  # referencias, no un análisis de datos: nunca lee ninguna variable de este
  # conjunto, pero jamovi exige que todo análisis esté vinculado a uno para
  # poder ejecutarse.
  - name: data
    type: Data

  # Selects which methodological topic the curated reference database
  # (refs_db in R/bibliography.b.R) is filtered to before rendering. Each
  # entry in that database is tagged with one or more topics; "all" skips
  # filtering.
  # ES: Selecciona el tema metodológico según el cual se filtra la base de
  # datos curada de referencias (refs_db en R/bibliography.b.R) antes de
  # renderizarla. Cada entrada de esa base está etiquetada con uno o más
  # temas; "all" omite el filtrado.
  - name: topic
    title: Theme
    type: List
    options:
      - title: All References
        name: all
      - title: Statistical Assumptions
        name: assumptions
      - title: Normality
        name: normality
      - title: Homogeneity / Homoscedasticity
        name: homoscedasticity
      - title: Linearity and Regression
        name: regression
      - title: Path Analysis
        name: path
      - title: Related Groups
        name: related
      - title: Time Series
        name: time_series
      - title: Robust Methods and Alternatives
        name: robust
    default: all

  # Selects which language's text bank is used to render the introduction,
  # topic labels, and table headings in the report. This only affects
  # language, never the citation style: AssumptionsLab always cites in
  # APA 7th edition and there is no citation-style selector anywhere in the
  # interface (see CODE_STYLE.md §21 / DEVELOPER_GUIDE.md).
  # ES: Selecciona qué banco de textos se usa para renderizar la
  # introducción, las etiquetas de tema y los encabezados de tabla en el
  # informe. Esto solo afecta el idioma, nunca el estilo de citación:
  # AssumptionsLab siempre cita en APA 7.ª edición y no existe un selector
  # de estilo de citación en ninguna parte de la interfaz (ver
  # CODE_STYLE.md §21 / DEVELOPER_GUIDE.md).
  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en
