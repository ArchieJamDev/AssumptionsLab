title: Independent Groups
name: groupCheck
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Group Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: ComboBox
            name: reportLang
            stretchFactor: 0
      - type: Label
        label: 'Statistical symbols remain in international format: n, M, SD, Mdn, Min, Max, IQR, CI, p, df.'
  - type: CollapseBox
    label: Test Options
    collapsed: false
    children:
      - type: ComboBox
        name: alt
      - type: CheckBox
        name: varEq
  - type: CollapseBox
    label: 'Plots: Distribution by Group'
    collapsed: true
    children:
      - type: CheckBox
        name: showDistributionPlot
      - type: CheckBox
        name: addViolinPlot
        enable: (showDistributionPlot)
      - type: CheckBox
        name: showJitterPoints
        enable: (showDistributionPlot)
      - type: CheckBox
        name: showMeanMarker
        enable: (showDistributionPlot)
      - type: CheckBox
        name: distColorByGroup
        enable: (showDistributionPlot)
  - type: CollapseBox
    label: 'Plots: Normality (Q-Q)'
    collapsed: true
    children:
      - type: CheckBox
        name: showQQPlots
      - type: CheckBox
        name: qqShowBand
        enable: (showQQPlots)
      - type: CheckBox
        name: qqFlagOutliers
        enable: (showQQPlots)
  - type: CollapseBox
    label: 'Plots: Normal Curve'
    collapsed: true
    children:
      - type: CheckBox
        name: showNormalCurvePlots
      - type: TextBox
        name: curveBandwidth
        format: number
        enable: (showNormalCurvePlots)
      - type: CheckBox
        name: curveShowRug
        enable: (showNormalCurvePlots)
  - type: CollapseBox
    label: General Plot Style
    collapsed: true
    children:
      - type: ComboBox
        name: plotStyle
      - type: ComboBox
        name: plotPalette
