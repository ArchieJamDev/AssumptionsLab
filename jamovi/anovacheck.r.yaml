---
name: anovaCheck
title: ANOVA/ANCOVA
jrs: '1.1'

items:
  - name: intro
    title: ANOVA/ANCOVA
    type: Html

  - name: designGuide
    title: Model design
    type: Html

  - name: designSummary
    title: Design summary
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: cellSummary
    title: Cell size and balance
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: cell
        title: Cell / group
        type: text
      - name: n
        title: n
        type: integer
      - name: mean
        title: M
        type: number
      - name: sd
        title: SD
        type: number
      - name: variance
        title: Variance
        type: number

  - name: designInterpretation
    title: Applied interpretation
    type: Html

  - name: diagnosticPlotsGuide
    title: ANOVA/ANCOVA diagnostic plots
    type: Html

  - name: groupBoxplotsPlot
    title: Dependent variable by group
    type: Image
    width: 600
    height: 340
    renderFun: .plotGroupBoxplots

  - name: groupBoxplotsGuide
    title: 'Guide: Dependent variable by group'
    type: Html

  - name: residualNormalityGuide
    title: Residual normality
    type: Html

  - name: residualNormality
    title: Residual normality
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: residualNormalityInterpretation
    title: Applied interpretation
    type: Html

  - name: residualsFittedPlot
    title: Residuals vs fitted values
    type: Image
    width: 560
    height: 315
    renderFun: .plotResidualsFitted

  - name: residualsFittedGuide
    title: 'Guide: Residuals vs fitted values'
    type: Html

  - name: qqResidualsPlot
    title: Residual Q-Q plot
    type: Image
    width: 560
    height: 310
    renderFun: .plotQQResiduals

  - name: qqResidualsGuide
    title: 'Guide: Residual Q-Q plot'
    type: Html

  - name: residualHistogramPlot
    title: Residual histogram
    type: Image
    width: 560
    height: 300
    renderFun: .plotResidualHistogram

  - name: residualHistogramGuide
    title: 'Guide: Residual histogram'
    type: Html

  - name: residualNormalCurvePlot
    title: Observed residual distribution vs theoretical normal curve
    type: Image
    width: 560
    height: 315
    renderFun: .plotResidualNormalCurve

  - name: residualNormalCurveGuide
    title: 'Guide: Observed distribution vs theoretical normal'
    type: Html

  - name: varianceGuide
    title: Homogeneity of variances
    type: Html

  - name: varianceTests
    title: Homogeneity of variances across groups
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: family
        title: Family
        type: text
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: df
        title: df
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: varianceInterpretation
    title: Applied interpretation
    type: Html

  - name: slopesGuide
    title: Homogeneity of slopes
    type: Html
    visible: (covs)

  - name: slopesTests
    title: Homogeneity of slopes in ANCOVA
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    visible: (covs)
    columns:
      - name: factor
        title: Factor
        type: text
      - name: covariate
        title: Covariate
        type: text
      - name: interaction
        title: Interaction
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: slopesInterpretation
    title: Applied interpretation
    type: Html
    visible: (covs)

  - name: covariateLinearityGuide
    title: Covariate linearity
    type: Html
    visible: (covs)

  - name: covariateLinearity
    title: Covariate linearity
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    visible: (covs)
    columns:
      - name: covariate
        title: Covariate
        type: text
      - name: dependent
        title: Dependent variable
        type: text
      - name: test
        title: Test / criterion
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: covariateLinearityInterpretation
    title: Applied interpretation
    type: Html
    visible: (covs)

  - name: multicollinearityGuide
    title: Multicollinearity
    type: Html
    visible: (covs)

  - name: multicollinearity
    title: Multicollinearity
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    visible: (covs)
    columns:
      - name: diagnostic
        title: Diagnostic
        type: text
      - name: item
        title: Item
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number

  - name: multicollinearityInterpretation
    title: Applied interpretation
    type: Html
    visible: (covs)

  - name: correlationMatrixGuide
    title: Correlation matrix
    type: Html
    visible: (covs)

  - name: pearsonMatrixTable
    title: Pearson correlation matrix (APA 7 format)
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    visible: (covs)
    rows: 0
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Distance correlation matrix (dCor, APA 7 format)
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    visible: (covs)
    rows: 0
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: (covs)

  - name: correlationComparisonGuide
    title: Pearson / dCor / copula entropy discordance analysis
    type: Html
    visible: (covs)

  - name: correlationComparisonTable
    title: Pairs with a notable gap between Pearson and dCor
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    visible: (covs)
    rows: 0
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Gap (dCor − |r|)
        type: number
      - name: ce
        title: Copula entropy
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Notable difference
        type: text

  - name: correlationComparisonInterpretation
    title: Applied interpretation
    type: Html
    visible: (covs)

  - name: influenceGuide
    title: Outlying and influential cases
    type: Html

  - name: influence
    title: Outlying and influential cases
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: case
        title: Case
        type: integer
      - name: fitted
        title: Adjusted
        type: number
      - name: residual
        title: Residual
        type: number
      - name: studResidual
        title: Studentized residual
        type: number
      - name: leverage
        title: Leverage
        type: number
      - name: cooksD
        title: Cook's D
        type: number
      - name: dffits
        title: DFFITS
        type: number
      - name: criteria
        title: Triggered criteria
        type: text

  - name: influenceInterpretation
    title: Applied interpretation
    type: Html

  - name: residualsLeveragePlot
    title: Studentized residuals vs leverage
    type: Image
    width: 600
    height: 350
    renderFun: .plotResidualsLeverage

  - name: residualsLeverageGuide
    title: 'Guide: Studentized residuals vs leverage'
    type: Html

  - name: cooksDPlot
    title: "Cook's D by case"
    type: Image
    width: 560
    height: 300
    renderFun: .plotCooksD

  - name: cooksDGuide
    title: "Guide: Cook's D by case"
    type: Html

  - name: independenceGuide
    title: Design independence
    type: Html

  - name: alternativesGuide
    title: Methodological alternatives
    type: Html

  - name: alternatives
    title: Methodological alternatives
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: problem
        title: Problem detected
        type: text
      - name: evidence
        title: Evidence
        type: text
      - name: suggestion
        title: Suggested option
        type: text

  - name: alternativesWhen
    title: ""
    type: Html

  - name: notes
    title: Notes and recommendation
    type: Html
