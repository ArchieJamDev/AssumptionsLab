title: Ordinal Logistic Regression
name: ordCheck
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable (ordinal, 3+ levels)
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Numeric Predictors
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
      - type: TargetLayoutBox
        label: Categorical Predictors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
  - type: CollapseBox
    label: Diagnostic Plots
    collapsed: true
    children:
      - type: CheckBox
        name: showPlots
  - type: CollapseBox
    label: 'Plots: Linearity in the Cumulative Logit'
    collapsed: true
    children:
      - type: CheckBox
        name: linShowPlots
        enable: (showPlots)
      - type: ComboBox
        name: linSmoother
        enable: (showPlots && linShowPlots)
      - type: TextBox
        name: linBins
        enable: (showPlots && linShowPlots)
        format: number
  - type: CollapseBox
    label: 'Plots: Influence'
    collapsed: true
    children:
      - type: CheckBox
        name: influenceShowPlots
        enable: (showPlots)
      - type: ComboBox
        name: influenceLabelMode
        enable: (showPlots && influenceShowPlots)
      - type: CheckBox
        name: influenceShowThreshold
        enable: (showPlots && influenceShowPlots)
