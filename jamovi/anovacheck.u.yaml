title: ANOVA/ANCOVA
name: anovaCheck
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    suggested:
      - continuous
      - nominal
      - ordinal
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: CollapseBox
    label: Diagnostic Plots
    collapsed: true
    children:
      - type: CheckBox
        name: showPlots
      - type: ComboBox
        name: plotSet
      - type: ComboBox
        name: residSmoother
      - type: CheckBox
        name: residShowBand
      - type: CheckBox
        name: residRefLine
      - type: ComboBox
        name: influenceLabelMode
      - type: CheckBox
        name: influenceShowThreshold
  - type: CollapseBox
    label: General Plot Style
    collapsed: true
    children:
      - type: ComboBox
        name: plotStyle
      - type: ComboBox
        name: plotPalette
