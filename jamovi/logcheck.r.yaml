---
name: logCheck
title: Logistic Regression
jrs: '1.1'

items:
  - name: intro
    title: Introduction
    type: Html

  - name: designGuide
    title: Model design
    type: Html

  - name: design
    title: Design summary
    type: Table
    columns:
      - name: element
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: separationGuide
    title: Complete separation
    type: Html

  - name: separation
    title: Complete separation
    type: Table
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: type
        title: Type
        type: text
      - name: coefficient
        title: Coefficient
        type: number
        format: decimal

  - name: separationInterpretation
    title: Applied interpretation
    type: Html

  - name: linearityGuide
    title: Linearity in the logit
    type: Html

  - name: linearity
    title: Linearity in the logit (Box-Tidwell)
    type: Table
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: statistic
        title: Statistic
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: linearityInterpretation
    title: Applied interpretation
    type: Html

  - name: linearityPlot
    title: Empirical logit vs predictor
    type: Image
    width: 560
    height: 340
    renderFun: .plotLinearity
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - linSmoother
      - linBins
      - reportLang

  - name: goodnessOfFitGuide
    title: Goodness of fit
    type: Html

  - name: goodnessOfFit
    title: Goodness of fit
    type: Table
    columns:
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: goodnessOfFitInterpretation
    title: Applied interpretation
    type: Html

  - name: calibrationPlot
    title: Calibration by probability decile
    type: Image
    width: 560
    height: 340
    renderFun: .plotCalibration
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - caliBins
      - caliRefLine
      - reportLang

  - name: discriminationGuide
    title: Discrimination
    type: Html

  - name: discrimination
    title: Discrimination
    type: Table
    columns:
      - name: metric
        title: Metric
        type: text
      - name: value
        title: Value
        type: number
        format: decimal

  - name: discriminationInterpretation
    title: Applied interpretation
    type: Html

  - name: discriminationPlot
    title: ROC curve
    type: Image
    width: 460
    height: 460
    renderFun: .plotROC
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - rocRefLine
      - rocShowAUCLabel
      - reportLang

  - name: multicollinearityGuide
    title: Multicollinearity
    type: Html
    visible: false

  - name: multicollinearity
    title: Multicollinearity
    type: Table
    visible: false
    columns:
      - name: diagnostic
        title: Diagnostic
        type: text
      - name: item
        title: Item
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number

  - name: multicollinearityInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: correlationMatrixGuide
    title: Correlation matrix
    type: Html
    visible: false

  - name: pearsonMatrixTable
    title: Pearson correlation matrix (APA 7 format)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Distance correlation matrix (dCor, APA 7 format)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: false

  - name: correlationComparisonGuide
    title: Pearson / dCor / copula entropy discordance analysis
    type: Html
    visible: false

  - name: correlationComparisonTable
    title: Pairs with a notable gap between Pearson and dCor
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Gap (dCor − |r|)
        type: number
      - name: ce
        title: Copula entropy
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Notable difference
        type: text

  - name: correlationComparisonInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: influenceGuide
    title: Influential cases
    type: Html

  - name: influence
    title: Influential cases
    type: Table
    columns:
      - name: case
        title: Case
        type: integer
      - name: cooksD
        title: Cook's D
        type: number
        format: decimal
      - name: leverage
        title: Leverage
        type: number
        format: decimal

  - name: influenceInterpretation
    title: Applied interpretation
    type: Html

  - name: influencePlot
    title: "Cook's D by case"
    type: Image
    width: 560
    height: 320
    renderFun: .plotInfluence
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - influenceLabelMode
      - influenceShowThreshold
      - reportLang

  - name: oddsRatiosGuide
    title: Odds Ratios
    type: Html

  - name: oddsRatios
    title: Odds Ratios
    type: Table
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: or
        title: OR
        type: number
        format: decimal
      - name: ciLower
        title: 95% CI lower
        type: number
        format: decimal
      - name: ciUpper
        title: 95% CI upper
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: oddsRatiosInterpretation
    title: Applied interpretation
    type: Html

  - name: notes
    title: Notes and recommendation
    type: Html
