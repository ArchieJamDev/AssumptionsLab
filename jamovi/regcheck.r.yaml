        type: text
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: df
        title: df
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: homoscedasticityInterpretation
    title: Applied interpretation
    type: Html


  - name: scaleLocationPlot
    title: Scale-location plot
    type: Image
    width: 560
    height: 315
    renderFun: .plotScaleLocation

  - name: scaleLocationGuide
    title: 'Guide: Scale-location plot'
    type: Html

  - name: independenceGuide
    title: Independence of errors
    type: Html

  - name: independence
    title: Independence of errors
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: text
      - name: pSig
        title: Sig.
        type: text

  - name: independenceInterpretation
