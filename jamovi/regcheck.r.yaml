  - name: multicollinearityGuide
    title: Multicollinearity
    type: Html
    visible: false

  - name: multicollinearity
    title: Multicollinearity
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    visible: false
    columns:
      - name: diagnostic
        title: Diagnostic
        type: text
      - name: item
        title: Item
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number

  - name: multicollinearityInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: influenceGuide
    title: Outlying and influential cases
    type: Html

  - name: influence
    title: Outlying and influential cases
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: case
        title: Case
        type: integer
      - name: fitted
        title: Adjusted
        type: number
      - name: residual
        title: Residual
        type: number
      - name: studResidual
        title: Studentized residual
        type: number
      - name: leverage
        title: Leverage
