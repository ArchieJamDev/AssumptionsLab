---
name: regCheck
title: Simple and Multiple Regression
jrs: '1.1'

items:
  - name: intro
    title: Simple and Multiple Regression
    type: Html

  - name: designGuide
    title: Regression model
    type: Html

  - name: modelSummary
    title: Model summary
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: missingSummary
    title: Missing data summary
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: linearityGuide
    title: Linearity
    type: Html

  - name: linearityPredictor
    title: Linearity by numeric predictor
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: dependent
        title: Dependent variable
        type: text
      - name: test
        title: Test / criterion
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: linearityModel
    title: Overall model linearity
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: scope
        title: Scope
        type: text
      - name: dependent
        title: Dependent variable
        type: text
      - name: test
        title: Test / criterion
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: linearityInterpretation
    title: Applied interpretation
    type: Html

  - name: correlationMatrixGuide
    title: Correlation matrix
    type: Html
    visible: false

  - name: pearsonMatrixTable
    title: Pearson correlation matrix (APA 7 format)
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Distance correlation matrix (dCor, APA 7 format)
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: false

  - name: correlationComparisonGuide
    title: Pearson / dCor / copula entropy discordance analysis
    type: Html
    visible: false

  - name: correlationComparisonTable
    title: Pairs with a notable gap between Pearson and dCor
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    rows: 0
    visible: false
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Gap (dCor − |r|)
        type: number
      - name: ce
        title: Copula entropy
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Notable difference
        type: text

  - name: correlationComparisonInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: correlationIndividualPlot
    title: Pairwise relationship (Pearson / dCor)
    type: Image
    width: 620
    height: 380
    renderFun: .plotCorrelationIndividual
    visible: false

  - name: correlationIndividualGuide
    title: 'Guide: Pairwise relationship (Pearson / dCor)'
    type: Html
    visible: false

  - name: correlationComparativePlot
    title: Pairwise comparison of Pearson, dCor, and copula entropy
    type: Image
    width: 620
    height: 380
    renderFun: .plotCorrelationComparative
    visible: false

  - name: correlationComparativeGuide
    title: 'Guide: Comparison of Pearson, dCor, and copula entropy'
    type: Html
    visible: false

  - name: diagnosticPlotsGuide
    title: Regression diagnostic plots
    type: Html

  - name: residualsFittedPlot
    title: Residuals vs fitted values
    type: Image
    width: 560
    height: 315
    renderFun: .plotResidualsFitted

  - name: residualsFittedGuide
    title: 'Guide: Residuals vs fitted values'
    type: Html

  - name: observedPredictedPlot
    title: Observed vs predicted values
    type: Image
    width: 560
    height: 315
    renderFun: .plotObservedPredicted

  - name: observedPredictedGuide
    title: 'Guide: Observed vs predicted values'
    type: Html

  - name: predictorEffectsPlot
    title: Visual effects of numeric predictors on the dependent variable
    type: Image
    width: 620
    height: 350
    renderFun: .plotPredictorEffects


  - name: predictorEffectsGuide
    title: 'Guide: Visual effects of numeric predictors'
    type: Html

  - name: residualNormalityGuide
    title: Residual normality
    type: Html

  - name: residualNormality
    title: Residual normality
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: residualNormalityInterpretation
    title: Applied interpretation
    type: Html

  - name: qqResidualsPlot
    title: Residual Q-Q plot
    type: Image
    width: 560
    height: 310
    renderFun: .plotQQResiduals

  - name: qqResidualsGuide
    title: 'Guide: Residual Q-Q plot'
    type: Html

  - name: residualHistogramPlot
    title: Residual histogram
    type: Image
    width: 560
    height: 300
    renderFun: .plotResidualHistogram

  - name: residualHistogramGuide
    title: 'Guide: Residual histogram'
    type: Html

  - name: residualNormalCurvePlot
    title: Observed residual distribution vs theoretical normal curve
    type: Image
    width: 560
    height: 315
    renderFun: .plotResidualNormalCurve


  - name: residualNormalCurveGuide
    title: 'Guide: Observed distribution vs theoretical normal'
    type: Html

  - name: homoscedasticityGuide
    title: Homoscedasticity and heteroscedasticity
    type: Html

  - name: homoscedasticity
    title: Homoscedasticity and heteroscedasticity
    type: Table
    clearWith:
      - dep
      - covs
      - factors
      - reportLang
    columns:
      - name: family
