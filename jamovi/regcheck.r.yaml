  - name: scaleLocationPlot
    title: Scale-location plot
    type: Image
    width: 560
    height: 315
    renderFun: .plotScaleLocation

  - name: scaleLocationGuide
    title: 'Guía: Scale-location plot'
    type: Html

  - name: independenceGuide
    title: Independencia de errores
    type: Html

  - name: independence
    title: Independencia de errores
    type: Table
    columns:
      - name: test
        title: Prueba
