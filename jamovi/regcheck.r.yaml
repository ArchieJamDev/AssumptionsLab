---
name: regCheck
title: Regresión simple y múltiple
jrs: '1.1'

items:
  - name: intro
    title: Regresión simple y múltiple
    type: Html

  - name: designGuide
    title: Modelo de regresión
    type: Html

  - name: modelSummary
    title: Resumen del modelo
    type: Table
    columns:
      - name: item
        title: Elemento
        type: text
      - name: value
        title: Valor
        type: text

  - name: missingSummary
    title: Resumen de datos faltantes
    type: Table
    columns:
      - name: item
        title: Elemento
        type: text
      - name: value
        title: Valor
        type: text

  - name: linearityGuide
    title: Linealidad
    type: Html

  - name: linearityPredictor
    title: Linealidad por predictor numérico
    type: Table
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: dependent
        title: Variable dependiente
        type: text
      - name: test
        title: Prueba / criterio
        type: text
      - name: statistic
        title: Estadístico
        type: text
      - name: value
        title: Valor
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: linearityModel
    title: Linealidad global del modelo
    type: Table
    columns:
      - name: scope
        title: Alcance
        type: text
      - name: dependent
        title: Variable dependiente
        type: text
      - name: test
        title: Prueba / criterio
        type: text
      - name: statistic
        title: Estadístico
        type: text
      - name: value
        title: Valor
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: linearityInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: correlationMatrixGuide
    title: Matriz de correlaciones
    type: Html
    visible: false

  - name: pearsonMatrixTable
    title: Matriz de correlaciones de Pearson (formato APA 7)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Matriz de correlación de distancia (dCor, formato APA 7)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: false

  - name: correlationComparisonGuide
    title: Análisis de discordancia Pearson / dCor / entropía copular
    type: Html
    visible: false

  - name: correlationComparisonTable
    title: Pares con diferencia notable entre Pearson y dCor
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Brecha (dCor − |r|)
        type: number
      - name: ce
        title: Entropía copular
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Diferencia notable
        type: text

  - name: correlationComparisonInterpretation
    title: Interpretación Aplicada
    type: Html
    visible: false

  - name: correlationIndividualPlot
    title: Relación por par (Pearson / dCor)
    type: Image
    width: 620
    height: 380
    renderFun: .plotCorrelationIndividual
    visible: false

  - name: correlationIndividualGuide
    title: 'Guía: Relación por par (Pearson / dCor)'
    type: Html
    visible: false

  - name: correlationComparativePlot
    title: Comparación de Pearson, dCor y entropía copular entre pares
    type: Image
    width: 620
    height: 380
    renderFun: .plotCorrelationComparative
    visible: false

  - name: correlationComparativeGuide
    title: 'Guía: Comparación de Pearson, dCor y entropía copular'
    type: Html
    visible: false

  - name: diagnosticPlotsGuide
    title: Gráficos diagnósticos de regresión
    type: Html

  - name: residualsFittedPlot
    title: Residuos vs valores ajustados
    type: Image
    width: 560
    height: 315
    renderFun: .plotResidualsFitted

  - name: residualsFittedGuide
    title: 'Guía: Residuos vs valores ajustados'
    type: Html

  - name: observedPredictedPlot
    title: Valores observados vs predichos
    type: Image
    width: 560
    height: 315
    renderFun: .plotObservedPredicted

  - name: observedPredictedGuide
    title: 'Guía: Valores observados vs predichos'
    type: Html

  - name: predictorEffectsPlot
    title: Efectos visuales de predictores numéricos sobre la dependiente
    type: Image
    width: 620
    height: 350
    renderFun: .plotPredictorEffects


  - name: predictorEffectsGuide
    title: 'Guía: Efectos visuales de predictores numéricos'
    type: Html

  - name: residualNormalityGuide
    title: Normalidad de residuos
    type: Html

  - name: residualNormality
