---
name: pathCheck
title: Path Analysis & Structural Validation
jrs: '1.1'

items:
  - name: intro
    title: Path Analysis
    type: Html

  - name: modelSummary
    title: Current model
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 1
    columns:
      - name: nVars
        title: Variables
        type: integer
      - name: nRelations
        title: Relationships
        type: integer
      - name: nEndog
        title: Endogenous variables
        type: integer
      - name: nExog
        title: Exogenous variables
        type: integer
      - name: nCases
        title: Complete cases
        type: integer
      - name: casesPerRelation
        title: Cases per relationship
        type: number

  - name: specifiedModel
    title: Specified model
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    columns:
      - name: dependent
        title: Dependent variable
        type: text
      - name: predictors
        title: Predictors
        type: text

  - name: modelStructureGuide
    title: Model Structure
    type: Html
    visible: (showExogenous || showEndogenous)

  - name: exogenousTable
    title: Model Exogenous Variables
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (showExogenous)
    columns:
      - name: variable
        title: Variable
        type: text
      - name: outgoingPaths
        title: Outgoing paths
        type: integer

  - name: endogenousTable
    title: Model Endogenous Variables
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (showEndogenous)
    columns:
      - name: variable
        title: Variable
        type: text
      - name: incomingPaths
        title: Direct predictors
        type: integer

  - name: validationSummary
    title: Model Methodological Validation
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    columns:
      - name: check
        title: Validation
        type: text
      - name: status
        title: Status
        type: text
      - name: details
        title: Details
        type: text

  - name: pathDiagram
    title: Path Diagram (SVG)
    type: Image
    width: 600
    height: 400
    renderFun: .plotPathDiagram
    visible: (showDiagram)

  - name: outlierGuide
    title: Multivariate Outliers
    type: Html
    visible: (isFinalized)

  - name: outlierTable
    title: Outlier Diagnostics
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized)
    columns:
      - name: case
        title: Case
        type: integer
      - name: d2
        title: Mahalanobis D²
        type: number
      - name: pD2
        title: p
        type: number
        format: zto,pvalue
      - name: leverage
        title: Leverage
        type: number
      - name: cooksD
        title: "Cook's distance"
        type: number
      - name: criteria
        title: Triggered criteria
        type: text

  - name: equationsGuide
    title: Model Design
    type: Html
    visible: (isFinalized)

  - name: pathCoefficients
    title: Path Coefficients
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showCoeffs)
    columns:
      - name: dep
        title: Endogenous Variable
        type: text
      - name: pred
        title: Predictor
        type: text
      - name: est
        title: Est.
        type: number
      - name: se
        title: SE
        type: number
      - name: t
        title: t
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: beta
        title: Beta Est.
        type: number

  - name: coefficientsInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized && showCoeffs)

  - name: rSquaredTable
    title: Explained Variance (R²)
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showR2)
    columns:
      - name: var
        title: Endogenous Variable
        type: text
      - name: r2
        title: R²
        type: number
      - name: adjR2
        title: Adjusted R²
        type: number

  - name: residualCovarianceGuide
    title: Residual Covariances
    type: Html
    visible: (isFinalized && showCovs)

  - name: residualCovarianceTable
    title: Residual Covariances Among Endogenous Variables
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showCovs)
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: covariance
        title: Covariance
        type: number
      - name: correlation
        title: Correlation
        type: number

  - name: residualPlots
    title: Residual Diagnostics by Equation
    type: Image
    width: 700
    height: 350
    renderFun: .plotResidualHistograms
    visible: (isFinalized && showResiduals)

  - name: normalityGuide
    title: Residual Normality
    type: Html
    visible: (isFinalized && showResiduals)

  - name: residualNormality
    title: Residual Normality by Equation
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showResiduals)
    columns:
      - name: dep
        title: Dependent Variable
        type: text
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: normalityInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized && showResiduals)

  - name: homoscedasticityGuide
    title: Homoscedasticity
    type: Html
    visible: (isFinalized)

  - name: homoscedasticity
    title: Homoscedasticity by Equation
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized)
    columns:
      - name: dep
        title: Dependent Variable
        type: text
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: df
        title: df
        type: text
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: homoscedasticityInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized)

  - name: multicollinearityGuide
    title: Multicollinearity
    type: Html
    visible: (isFinalized)

  - name: multicollinearity
    title: Multicollinearity by Equation
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized)
    columns:
      - name: dep
        title: Dependent Variable
        type: text
      - name: diagnostic
        title: Diagnostic
        type: text
      - name: item
        title: Item
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number

  - name: multicollinearityInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized)

  - name: mardiaGuide
    title: Multivariate Normality (Mardia)
    type: Html
    visible: (isFinalized)

  - name: mardiaTable
    title: "Mardia's Multivariate Normality Test"
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized)
    columns:
      - name: measure
        title: Measure
        type: text
      - name: value
        title: Coefficient
        type: number
      - name: statistic
        title: Statistic
        type: number
      - name: df
        title: df
        type: text
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: mardiaInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized)

  - name: correlationMatrixGuide
    title: Correlation Matrix
    type: Html
    visible: (isFinalized && showCorrs)

  - name: pearsonMatrixTable
    title: Pearson Correlation Matrix (APA 7 Format)
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showCorrs)
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Distance Correlation Matrix (dCor, APA 7 Format)
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showCorrs)
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: (isFinalized && showCorrs)

  - name: correlationComparisonGuide
    title: Pearson / dCor / Copula Entropy Discordance Analysis
    type: Html
    visible: (isFinalized && showCorrs)

  - name: correlationComparisonTable
    title: Pairs with a Notable Gap Between Pearson and dCor
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showCorrs)
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Gap (dCor − |r|)
        type: number
      - name: ce
        title: Copula Entropy
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Notable difference
        type: text

  - name: correlationComparisonInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized && showCorrs)

  - name: crossEntropyGuide
    title: Independence via Copula Entropy
    type: Html
    visible: (isFinalized && showCorrs)

  - name: crossEntropyTable
    title: Copula Entropy Independence Test
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized && showCorrs)
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: connected
        title: Connected in the model
        type: text
      - name: ce
        title: Copula Entropy
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: crossEntropyInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized && showCorrs)

  - name: indirectEffectsGuide
    title: Direct, Indirect, and Total Effects
    type: Html
    visible: (isFinalized)

  - name: indirectEffectsTable
    title: Direct, Indirect, and Total Effects (Simple Mediation)
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized)
    columns:
      - name: x
        title: Predictor (X)
        type: text
      - name: m
        title: Mediator (M)
        type: text
      - name: y
        title: Dependent Variable (Y)
        type: text
      - name: directBeta
        title: Direct Effect (β)
        type: number
      - name: indirectBeta
        title: Indirect Effect (β)
        type: number
      - name: totalBeta
        title: Total Effect (β)
        type: number
      - name: sobelZ
        title: Sobel z
        type: number
      - name: sobelP
        title: p
        type: number
        format: zto,pvalue
      - name: sobelPSig
        title: Sig.
        type: text

  - name: indirectEffectsInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized)

  - name: sampleSizeGuide
    title: Sample Size Adequacy
    type: Html
    visible: (isFinalized)

  - name: sampleSizeTable
    title: Sample Size Assessment by Model Complexity
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized)
    columns:
      - name: criterion
        title: Criterion (author)
        type: text
      - name: rule
        title: Rule
        type: text
      - name: required
        title: Required N
        type: number
      - name: actual
        title: Current N
        type: integer
      - name: status
        title: Status
        type: text

  - name: sampleSizeInterpretation
    title: Applied interpretation
    type: Html
    visible: (isFinalized)

  - name: modelDiagnosticConclusionGuide
    title: Model Diagnostic Conclusion
    type: Html
    visible: (isFinalized)

  - name: modelDiagnosticConclusionTable
    title: Model Diagnostics Summary
    type: Table
    clearWith:
      - vars
      - relations
      - isFinalized
      - permutations
      - permutationSeed
      - reportLang
    rows: 0
    visible: (isFinalized)
    columns:
      - name: area
        title: Diagnostic Area
        type: text
      - name: status
        title: Status
        type: text
      - name: detail
        title: Detail
        type: text

  - name: modelDiagnosticConclusionInterpretation
    title: Overall Verdict
    type: Html
    visible: (isFinalized)
