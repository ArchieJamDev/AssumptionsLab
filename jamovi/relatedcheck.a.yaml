name: relatedCheck
title: Related Groups
menuTitle: Related Groups
menuGroup: Assumption Lab
menuSubgroup: Group Comparison
version: '1.0.0'
jas: '1.2'
options:
  - name: data
    type: Data
  # The set of related (repeated/paired) numeric measurements to compare —
  # two measurements run a paired t-test/Wilcoxon; more than two run a
  # repeated-measures ANOVA/Friedman comparison instead.
  # ES: El conjunto de mediciones numéricas relacionadas (repetidas/
  # pareadas) a comparar — dos mediciones corren una t pareada/Wilcoxon;
  # más de dos corren en cambio una comparación por ANOVA de medidas
  # repetidas/Friedman.
  - name: measures
    title: Related Measurements
    type: Variables
    suggested:
      - continuous
    permitted:
      - numeric
    default: null
  # Selects which language's text bank (see texts.R) is used to render
  # every guide, interpretation, and table/column title in the report.
  # ES: Selecciona qué banco de textos (ver texts.R) se usa para renderizar
  # cada guía, interpretación y título de tabla/columna en el informe.
  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en
  # Master switch for the profile plot (one line per subject across every
  # measurement) — shows whether subjects move together or diverge across
  # occasions, beyond what the paired-difference summary alone conveys.
  # ES: Interruptor maestro para el gráfico de perfil (una línea por
  # sujeto a través de cada medición) — muestra si los sujetos se mueven
  # juntos o divergen entre ocasiones, más allá de lo que transmite por sí
  # solo el resumen de diferencias pareadas.
  - name: showProfilePlot
    title: Profile plot by measurement
    type: Bool
    default: false

  # Master switch for the paired-difference distribution plot (one panel
  # per pairwise comparison).
  # ES: Interruptor maestro para el gráfico de distribución de diferencias
  # pareadas (un panel por comparación).
  - name: showDifferencePlots
    title: Paired differences plots
    type: Bool
    default: false

  # Master switch for the normality plots (Q-Q and observed-vs-normal
  # density) of the paired differences.
  # ES: Interruptor maestro para los gráficos de normalidad (Q-Q y
  # densidad observada vs normal) de las diferencias pareadas.
  - name: showNormalityPlots
    title: Normality plots
    type: Bool
    default: false

  # -----------------------------------------------------------------------------
  # Plot color palette - see logcheck.a.yaml's plotPalette for the full
  # rationale (jamovi review team feedback, 2026-09-16). Default follows
  # jamovi's own global Theme/palette; the two other choices are genuinely
  # additive (jamovi does not currently ship a colorblind-safe or viridis
  # palette). The old plotStyle option (clean/bw/contrast/fullColor) is
  # removed: it duplicated jamovi's own Theme setting 1:1.
  # ES: Paleta de color del gráfico - ver plotPalette en logcheck.a.yaml
  # para el razonamiento completo (retroalimentación del equipo de
  # revisión de jamovi, 2026-09-16). El valor por defecto sigue el Tema/
  # paleta global de jamovi; las otras dos opciones son genuinamente
  # aditivas (jamovi no ofrece hoy una paleta apta para daltonismo ni
  # viridis). La antigua opción plotStyle (clean/bw/contrast/fullColor) se
  # elimina: duplicaba 1:1 el propio ajuste de Tema de jamovi.
  # -----------------------------------------------------------------------------
  - name: plotPalette
    title: Color Palette by Measurement
    type: List
    options:
      - title: Follow jamovi theme (default)
        name: jamovi
      - title: Colorblind-safe (Okabe-Ito)
        name: colorblind
      - title: Viridis
        name: viridis
    default: jamovi
