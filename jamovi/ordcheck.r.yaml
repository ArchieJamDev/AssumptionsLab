---
name: ordCheck
title: Regresión logística ordinal
jrs: '1.1'

items:
  - name: intro
    title: Introducción
    type: Html

  - name: designGuide
    title: Diseño del modelo
    type: Html

  - name: design
    title: Resumen del diseño
    type: Table
    columns:
      - name: element
        title: Elemento
        type: text
      - name: value
        title: Valor
        type: text

  - name: categoryDistribution
    title: Distribución por categoría
    type: Table
    rows: 0
    columns:
      - name: category
        title: Categoría
        type: text
      - name: n
        title: n
        type: integer
      - name: proportion
        title: Proporción
        type: number
        format: pc

  - name: separationGuide
    title: Separación completa
    type: Html

  - name: separation
    title: Separación completa
    type: Table
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: type
        title: Tipo
        type: text
      - name: coefficient
        title: Coeficiente
        type: number
        format: decimal

  - name: separationInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: linearityGuide
    title: Linealidad en el logit acumulativo
    type: Html

  - name: linearity
    title: Linealidad en el logit acumulativo (Box-Tidwell)
    type: Table
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: statistic
        title: Estadístico
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: linearityInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: linearityPlot
    title: Logit empírico vs predictor
    type: Image
    requiresData: true
    width: 560
    height: 340
    renderFun: .plotLinearity
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - linSmoother
      - linBins
      - reportLang

  - name: proportionalOddsGuide
    title: Momios proporcionales (líneas paralelas)
    type: Html

  - name: proportionalOdds
    title: Prueba de Brant
    type: Table
    rows: 0
    columns:
      - name: term
        title: Término
        type: text
      - name: chiSq
        title: X²
        type: number
        format: decimal
      - name: df
        title: gl
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: proportionalOddsInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: goodnessOfFitGuide
    title: Bondad de ajuste
    type: Html

  - name: goodnessOfFit
    title: Bondad de ajuste
    type: Table
    rows: 0
    columns:
      - name: test
        title: Prueba
        type: text
      - name: statistic
        title: Estadístico
        type: number
        format: decimal
      - name: df
        title: gl
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: goodnessOfFitInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: discriminationGuide
    title: Pseudo-R²
    type: Html

  - name: discrimination
    title: Pseudo-R²
    type: Table
    columns:
      - name: metric
        title: Métrica
        type: text
      - name: value
        title: Valor
        type: number
        format: decimal

  - name: discriminationInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: multicollinearityGuide
    title: Multicolinealidad
    type: Html
    visible: false

  - name: multicollinearity
    title: Multicolinealidad
    type: Table
    visible: false
    columns:
      - name: diagnostic
        title: Diagnóstico
        type: text
      - name: item
        title: Elemento
        type: text
      - name: statistic
        title: Estadístico
        type: text
      - name: value
        title: Valor
        type: number

  - name: multicollinearityInterpretation
    title: Interpretación Aplicada
    type: Html
    visible: false

  - name: correlationMatrixGuide
    title: Matriz de correlaciones
    type: Html
    visible: false

  - name: pearsonMatrixTable
    title: Matriz de correlaciones de Pearson (formato APA 7)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Matriz de correlación de distancia (dCor, formato APA 7)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: false

  - name: correlationComparisonGuide
    title: Análisis de discordancia Pearson / dCor / entropía copular
    type: Html
    visible: false

  - name: correlationComparisonTable
    title: Pares con diferencia notable entre Pearson y dCor
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Brecha (dCor − |r|)
        type: number
      - name: ce
        title: Entropía copular
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Diferencia notable
        type: text

  - name: correlationComparisonInterpretation
    title: Interpretación Aplicada
    type: Html
    visible: false

  - name: influenceGuide
    title: Casos influyentes
    type: Html

  - name: influence
    title: Casos influyentes
    type: Table
    rows: 0
    columns:
      - name: case
        title: Caso
        type: integer
      - name: observed
        title: Categoría observada
        type: text
      - name: pearsonStat
        title: Estadístico de Pearson
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue

  - name: influenceInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: influencePlot
    title: Residuo de Pearson por caso
    type: Image
    requiresData: true
    width: 560
    height: 320
    renderFun: .plotInfluence
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - influenceLabelMode
      - influenceShowThreshold
      - reportLang

  - name: coefficientsGuide
    title: Coeficientes y odds ratios (momios proporcionales)
    type: Html

  - name: coefficients
    title: Coeficientes y odds ratios
    type: Table
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: or
        title: OR
        type: number
        format: decimal
      - name: ciLower
        title: IC 95% inferior
        type: number
        format: decimal
      - name: ciUpper
        title: IC 95% superior
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: coefficientsInterpretation
    title: Interpretación Aplicada
    type: Html

  - name: cutpoints
    title: Puntos de corte (intercepts)
    type: Table
    rows: 0
    columns:
      - name: cutpoint
        title: Punto de corte
        type: text
      - name: estimate
        title: Estimación
        type: number
        format: decimal
      - name: se
        title: EE
        type: number
        format: decimal

  - name: notes
    title: Notas y recomendación
    type: Html
