---
name: relatedCheck
title: Related groups
jrs: '1.1'

items:
  - name: intro
    title: Related groups
    type: Html

  - name: designGuide
    title: Related-groups design
    type: Html

  - name: designSummary
    title: Design summary
    type: Table
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: descriptiveSummary
    title: Descriptives by measurement
    type: Table
    columns:
      - name: measure
        title: Measurement
        type: text
      - name: n
        title: n
        type: integer
      - name: mean
        title: M
        type: number
      - name: sd
        title: SD
        type: number
      - name: median
        title: Mdn
        type: number
      - name: min
        title: Min
        type: number
      - name: max
        title: Max
        type: number
      - name: missing
        title: Missing
        type: integer

  - name: profilePlot
    title: Profile of related measurements
    type: Image
    width: 560
    height: 315
    renderFun: .plotProfile
    visible: (showProfilePlot)
    clearWith:
      - measures
      - showProfilePlot
      - plotStyle
      - plotPalette
      - reportLang

  - name: differencePlot
    title: Distribution of paired differences
    type: Image
    width: 560
    height: 315
    renderFun: .plotDifferences
    visible: (showDifferencePlots)
    clearWith:
      - measures
      - showDifferencePlots
      - plotStyle
      - plotPalette
      - reportLang

  - name: normalityPlot
    title: Q-Q plots of paired differences
    type: Image
    width: 620
    height: 360
    renderFun: .plotNormality
    visible: (showNormalityPlots)
    clearWith:
      - measures
      - showNormalityPlots
      - plotStyle
      - reportLang


  - name: normalCurvePlot
    title: Observed distribution vs theoretical normal
    type: Image
    width: 620
    height: 360
    renderFun: .plotNormalCurve
    visible: (showNormalityPlots)
    clearWith:
      - measures
      - showNormalityPlots
      - plotStyle
      - reportLang


  - name: differenceGuide
    title: Paired differences
    type: Html

  - name: differenceSummary
    title: Summary of paired differences
    type: Table
    columns:
      - name: comparison
        title: Comparison
        type: text
      - name: n
        title: n
        type: integer
      - name: meanDiff
        title: M difference
        type: number
      - name: sdDiff
        title: SD difference
        type: number
      - name: medianDiff
        title: Mdn difference
        type: number
      - name: minDiff
        title: Min
        type: number
      - name: maxDiff
        title: Max
        type: number

  - name: normalityGuide
    title: Normality of differences/residuals
    type: Html

  - name: normality
    title: Normality of differences/residuals
    type: Table
    columns:
      - name: scope
        title: Scope
        type: text
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: normalitySummary
    title: Normality summary by comparison
    type: Table
    columns:
      - name: comparison
        title: Comparison
        type: text
      - name: tests
        title: Valid tests
        type: integer
      - name: significant
        title: Significant tests
        type: integer
      - name: interpretation
        title: Interpretation
        type: text

  - name: normalityRecommendation
    title: Recommendation
    type: Html
  - name: normalityInterpretation
    title: Applied interpretation
    type: Html

  - name: symmetryGuide
    title: Symmetry of differences
    type: Html

  - name: symmetry
    title: Symmetry of differences
    type: Table
    columns:
      - name: comparison
        title: Comparison
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: symmetryInterpretation
    title: Applied interpretation
    type: Html

  - name: sphericityGuide
    title: Sphericity
    type: Html
    visible: false

  - name: sphericity
    title: Sphericity and corrections
    type: Table
    visible: false
    columns:
      - name: diagnostic
        title: Diagnostic
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number
      - name: df
        title: df
        type: integer
      - name: p
        title: p
        type: text
      - name: pSig
        title: Sig.
        type: text

  - name: sphericityInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: correlationMatrixGuide
    title: Correlation matrix
    type: Html
    visible: false

  - name: pearsonMatrixTable
    title: Pearson correlation matrix (APA 7 format)
    type: Table
    visible: false
    rows: 0
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Distance correlation matrix (dCor, APA 7 format)
    type: Table
    visible: false
    rows: 0
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: false

  - name: correlationComparisonGuide
    title: Pearson / dCor / copula entropy discordance analysis
    type: Html
    visible: false

  - name: correlationComparisonTable
    title: Pairs with a notable gap between Pearson and dCor
    type: Table
    visible: false
    rows: 0
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Gap (dCor − |r|)
        type: number
      - name: ce
        title: Copula entropy
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Notable difference
        type: text

  - name: correlationComparisonInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: outliersGuide
    title: Outliers in differences
    type: Html

  - name: outliers
    title: Outliers in differences
    type: Table
    columns:
      - name: case
        title: Case
        type: integer
      - name: comparison
        title: Comparison
        type: text
      - name: difference
        title: Difference
        type: number
      - name: criterion
        title: Triggered criterion
        type: text

  - name: outliersInterpretation
    title: Applied interpretation
    type: Html

  - name: methodGuide
    title: Test selection
    type: Html

  - name: methodOptions
    title: Methodological options
    type: Table
    columns:
      - name: design
        title: Design
        type: text
      - name: evidence
        title: Evidence
        type: text
      - name: suggestion
        title: Suggested test
        type: text

  - name: methodWhen
    title: ""
    type: Html
  - name: notes
    title: Notes and recommendation
    type: Html
