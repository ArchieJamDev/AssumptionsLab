title: Simple and Multiple Regression
name: regCheck
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Numeric Predictors
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
      - type: TargetLayoutBox
        label: Categorical Predictors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
  - type: Label
    label: Output
    children:
      - type: CheckBox
        name: showGuides
      - type: CheckBox
        name: showPlots
  - type: CollapseBox
    label: 'Plots: Linearity'
    collapsed: true
    children:
      - type: CheckBox
        name: linShowPlots
        enable: (showPlots)
      - type: ComboBox
        name: linSmoother
        enable: (showPlots && linShowPlots)
      - type: CheckBox
        name: linShowBand
        enable: (showPlots && linShowPlots)
      - type: CheckBox
        name: linRefLine
        enable: (showPlots && linShowPlots)
  - type: CollapseBox
    label: 'Plots: Normality'
    collapsed: true
    children:
      - type: CheckBox
        name: normShowPlots
        enable: (showPlots)
      - type: CheckBox
        name: normQQBand
        enable: (showPlots && normShowPlots)
      - type: ComboBox
        name: normHistBins
        enable: (showPlots && normShowPlots)
      - type: CheckBox
        name: normCurveOverlay
        enable: (showPlots && normShowPlots)
      - type: CheckBox
        name: normFlagOutliers
        enable: (showPlots && normShowPlots)
  - type: CollapseBox
    label: 'Plots: Homoscedasticity'
    collapsed: true
    children:
      - type: CheckBox
        name: homoShowPlots
        enable: (showPlots)
      - type: ComboBox
        name: homoSmoother
        enable: (showPlots && homoShowPlots)
      - type: CheckBox
        name: homoShowBand
        enable: (showPlots && homoShowPlots)
  - type: CollapseBox
    label: 'Plots: Correlations'
    collapsed: true
    children:
      - type: CheckBox
        name: corrShowIndividual
        enable: (showPlots)
      - type: CheckBox
        name: corrShowComparative
        enable: (showPlots)
      - type: CheckBox
        name: corrIndividualFit
        enable: (showPlots && corrShowIndividual)
      - type: ComboBox
        name: corrComparativeStyle
        enable: (showPlots && corrShowComparative)
      - type: CheckBox
        name: corrHighlightDiscordant
        enable: (showPlots && (corrShowIndividual || corrShowComparative))
  - type: CollapseBox
    label: 'Plots: Influence'
    collapsed: true
    children:
      - type: CheckBox
        name: influenceShowPlots
        enable: (showPlots)
      - type: ComboBox
        name: influenceLabelMode
        enable: (showPlots && influenceShowPlots)
      - type: CheckBox
        name: influenceShowThreshold
        enable: (showPlots && influenceShowPlots)
