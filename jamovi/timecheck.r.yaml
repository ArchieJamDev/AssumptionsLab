# -----------------------------------------------------------------------------
# Jamovi Results Specification - Series Temporales
# -----------------------------------------------------------------------------
name: timeCheck
title: Series Temporales
jrs: '1.1'

items:
  - name: intro
    title: Series Temporales
    type: Html

  - name: modelProfile
    title: Perfil metodológico del modelo
    type: Table
    rows: 0
    columns:
      - name: element
        title: Elemento
        type: text
      - name: value
        title: Valor
        type: text

  - name: modelDescription
    title: Sobre este modelo
    type: Html

  - name: conditionsMatrix
    title: Supuestos y condiciones a evaluar
    type: Table
    rows: 0
    columns:
      - name: area
        title: Área
        type: text
      - name: condition
        title: Supuesto / condición
        type: text
      - name: diagnostic
        title: Diagnóstico
        type: text

  - name: decisionsMatrix
    title: Función metodológica y decisión asociada
    type: Table
    rows: 0
    columns:
      - name: area
        title: Área
        type: text
      - name: condition
        title: Supuesto / condición
        type: text
      - name: role
        title: Función metodológica
        type: text
      - name: decision
        title: Decisión asociada
        type: text

  - name: runNotice
    title: Aviso
    type: Html
    visible: false

  - name: seriesPlot
    title: Serie(s) temporal(es)
    type: Image
    width: 700
    height: 280
    renderFun: .plotSeries
    visible: false

  - name: diagnosticsResults
    title: Resultados de las pruebas
    type: Table
    rows: 0
    columns:
      - name: test
        title: Prueba
        type: text
      - name: statistic
        title: Estadístico
        type: text
      - name: pvalue
        title: p
        type: text
      - name: evidence
        title: Evidencia
        type: text

  - name: acfPlot
    title: Autocorrelación (ACF)
    type: Image
    width: 460
    height: 260
    renderFun: .plotAcf
    visible: false

  - name: pacfPlot
    title: Autocorrelación parcial (PACF)
    type: Image
    width: 460
    height: 260
    renderFun: .plotPacf
    visible: false

  - name: residualsPlot
    title: Residuos en el tiempo
    type: Image
    width: 700
    height: 260
    renderFun: .plotResiduals
    visible: false

  - name: volatilityPlot
    title: Volatilidad condicional estimada
    type: Image
    width: 700
    height: 260
    renderFun: .plotVolatility
    visible: false

  - name: interpretation
    title: Lectura metodológica
    type: Html

  - name: foundations
    title: Fundamentos metodológicos y referencias
    type: Html

  - name: diagnosticsActions
    title: Acción metodológica recomendada
    type: Table
    rows: 0
    columns:
      - name: test
        title: Prueba
        type: text
      - name: action
        title: Acción recomendada
        type: text

  - name: implementationNotes
    title: Alcance de esta versión
    type: Html
