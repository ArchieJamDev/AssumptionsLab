# -----------------------------------------------------------------------------
# Jamovi Results Specification - Series Temporales
# -----------------------------------------------------------------------------
name: timeCheck
title: Time Series
jrs: '1.1'

items:
  - name: intro
    title: Time Series
    type: Html

  - name: modelProfile
    title: Model methodological profile
    type: Table
    clearWith:
      - dateVar
      - exogenous
      - frequency
      - model
      - series
      - reportLang
    rows: 0
    columns:
      - name: element
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: modelDescription
    title: About this model
    type: Html

  - name: conditionsMatrix
    title: Assumptions and conditions to evaluate
    type: Table
    clearWith:
      - dateVar
      - exogenous
      - frequency
      - model
      - series
      - reportLang
    rows: 0
    columns:
      - name: area
        title: Area
        type: text
      - name: condition
        title: Assumption / condition
        type: text
      - name: diagnostic
        title: Diagnostic
        type: text

  - name: decisionsMatrix
    title: Methodological function and associated decision
    type: Table
    clearWith:
      - dateVar
      - exogenous
      - frequency
      - model
      - series
      - reportLang
    rows: 0
    columns:
      - name: area
        title: Area
        type: text
      - name: condition
        title: Assumption / condition
        type: text
      - name: role
        title: Methodological function
        type: text
      - name: decision
        title: Associated decision
        type: text

  - name: runNotice
    title: Notice
    type: Html
    visible: false

  - name: seriesPlot
    title: Time series
    type: Image
    width: 700
    height: 280
    renderFun: .plotSeries
    visible: false

  - name: diagnosticsResults
    title: Test results
    type: Table
    clearWith:
      - dateVar
      - exogenous
      - frequency
      - model
      - series
      - reportLang
    rows: 0
    columns:
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: pvalue
        title: p
        type: text
      - name: evidence
        title: Evidence
        type: text

  - name: acfPlot
    title: Autocorrelation (ACF)
    type: Image
    width: 460
    height: 260
    renderFun: .plotAcf
    visible: false

  - name: pacfPlot
    title: Partial autocorrelation (PACF)
    type: Image
    width: 460
    height: 260
    renderFun: .plotPacf
    visible: false

  - name: residualsPlot
    title: Residuals over time
    type: Image
    width: 700
    height: 260
    renderFun: .plotResiduals
    visible: false

  - name: volatilityPlot
    title: Estimated conditional volatility
    type: Image
    width: 700
    height: 260
    renderFun: .plotVolatility
    visible: false

  - name: interpretation
    title: Methodological reading
    type: Html

  - name: foundations
    title: Methodological foundations and references
    type: Html

  - name: diagnosticsActions
    title: Recommended methodological action
    type: Table
    clearWith:
      - dateVar
      - exogenous
      - frequency
      - model
      - series
      - reportLang
    rows: 0
    columns:
      - name: test
        title: Test
        type: text
      - name: action
        title: Recommended action
        type: text

  - name: implementationNotes
    title: Scope of this version
    type: Html
