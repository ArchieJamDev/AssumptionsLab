name: assumptionLibrary
title: Assumption Library
menuTitle: Assumption Library
menuGroup: Assumption Lab
menuSubgroup: Methodological Guide
version: '1.0.0'
jas: '1.2'
options:
  - name: data
    type: Data
  - name: category
    title: Category
    type: List
    options:
      - title: All Categories
        name: all
      - title: Normality
        name: normality
      - title: Homoscedasticity / Homogeneity
        name: homoscedasticity
      - title: Linearity
        name: linearity
      - title: Independence
        name: independence
      - title: Multicollinearity
        name: multicollinearity
      - title: Outliers and Influence
        name: influence
      - title: Sphericity
        name: sphericity
      - title: Transformations and Robust Alternatives
        name: robust
    default: all
  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en
