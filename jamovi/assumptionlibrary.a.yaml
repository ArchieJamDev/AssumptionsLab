name: assumptionLibrary
title: Assumption Library / Biblioteca de Supuestos
menuTitle: Assumption Library / Biblioteca de Supuestos
menuGroup: Assumption Lab
menuSubgroup: Methodological Guide / Guía Metodológica
version: '1.0.0'
jas: '1.2'
options:
  - name: data
    type: Data
  - name: category
    title: Category / Categoría
    type: List
    options:
      - title: All Categories / Todas las categorías
        name: all
      - title: Normality / Normalidad
        name: normality
      - title: Homoscedasticity / Homogeneity / Homocedasticidad / Homogeneidad
        name: homoscedasticity
      - title: Linearity / Linealidad
        name: linearity
      - title: Independence / Independencia
        name: independence
      - title: Multicollinearity / Multicolinealidad
        name: multicollinearity
      - title: Outliers and Influence / Casos atípicos e influencia
        name: influence
      - title: Sphericity / Esfericidad
        name: sphericity
      - title: Transformations and Robust Alternatives / Transformaciones y alternativas robustas
        name: robust
    default: all
  - name: reportLang
    title: Report Language / Idioma del reporte
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en
