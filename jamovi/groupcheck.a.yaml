name: groupCheck
title: Independent Groups
menuTitle: Independent Groups
menuGroup: Assumption Lab
menuSubgroup: Group Comparison
version: '1.0.0'
jas: '1.2'
options:
  - name: data
    type: Data
  - name: dep
    title: Dependent Variable
    type: Variable
  - name: group
    title: Group Variable
    type: Variable
  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en
  - name: showDistributionPlot
    title: Distribution by group
    type: Bool
    default: false
  - name: addViolinPlot
    title: Violin plot
    type: Bool
    default: false
  - name: showJitterPoints
    title: Individual data points
    type: Bool
    default: false
  - name: showMeanMarker
    title: Mean marker
    type: Bool
    default: true
  - name: showQQPlots
    title: Q-Q plots
    type: Bool
    default: false
  - name: qqShowBand
    title: Confidence band
    type: Bool
    default: true
  - name: qqFlagOutliers
    title: Extreme cases (|z| > 2.5)
    type: Bool
    default: true
  - name: showNormalCurvePlots
    title: Observed vs. theoretical normal curve
    type: Bool
    default: false
  - name: curveBandwidth
    title: Curve Smoothing (bandwidth)
    type: Number
    default: 1
    min: 0.3
    max: 3
    description: Multiplier for the density estimate's bandwidth (adjust in density()); lower values show more detail, higher values smooth more.
  - name: curveShowRug
    title: Individual values (rug)
    type: Bool
    default: false
  - name: distColorByGroup
    title: Color by group
    type: Bool
    default: true
  # -----------------------------------------------------------------------------
  # Plot color palette - see logcheck.a.yaml's plotPalette for the full
  # rationale (jamovi review team feedback, 2026-09-16). Default follows
  # jamovi's own global Theme/palette; the two other choices are genuinely
  # additive (jamovi does not currently ship a colorblind-safe or viridis
  # palette). The old plotStyle option (clean/bw/contrast/fullColor) is
  # removed: it duplicated jamovi's own Theme setting 1:1.
  # ES: Paleta de color del gráfico - ver plotPalette en logcheck.a.yaml
  # para el razonamiento completo (retroalimentación del equipo de
  # revisión de jamovi, 2026-09-16). El valor por defecto sigue el Tema/
  # paleta global de jamovi; las otras dos opciones son genuinamente
  # aditivas (jamovi no ofrece hoy una paleta apta para daltonismo ni
  # viridis). La antigua opción plotStyle (clean/bw/contrast/fullColor) se
  # elimina: duplicaba 1:1 el propio ajuste de Tema de jamovi.
  # -----------------------------------------------------------------------------
  - name: plotPalette
    title: Color Palette by Group
    type: List
    options:
      - title: Follow jamovi theme (default)
        name: jamovi
      - title: Colorblind-safe (Okabe-Ito)
        name: colorblind
      - title: Viridis
        name: viridis
    default: jamovi
