---
name: multCheck
title: Multinomial Logistic Regression
jrs: '1.1'

items:
  - name: intro
    title: Introduction
    type: Html

  - name: designGuide
    title: Model design
    type: Html

  - name: design
    title: Design summary
    type: Table
    columns:
      - name: element
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: categoryDistribution
    title: Distribution by category
    type: Table
    rows: 0
    columns:
      - name: category
        title: Category
        type: text
      - name: n
        title: n
        type: integer
      - name: proportion
        title: Proportion
        type: number
        format: pc

  - name: separationGuide
    title: Complete separation
    type: Html

  - name: separation
    title: Complete separation
    type: Table
    rows: 0
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: category
        title: Category
        type: text
      - name: type
        title: Type
        type: text
      - name: coefficient
        title: Coefficient
        type: number
        format: decimal

  - name: separationInterpretation
    title: Applied interpretation
    type: Html

  - name: linearityGuide
    title: Linearity in the multinomial logit
    type: Html

  - name: linearity
    title: Linearity in the multinomial logit (LR test)
    type: Table
    rows: 0
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: chiSq
        title: X²
        type: number
        format: decimal
      - name: df
        title: df
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: linearityInterpretation
    title: Applied interpretation
    type: Html

  - name: linearityPlot
    title: Empirical logit vs predictor
    type: Image
    width: 640
    height: 400
    renderFun: .plotLinearity
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - linSmoother
      - linBins
      - reportLang

  - name: iiaGuide
    title: Independence of irrelevant alternatives (IIA)
    type: Html

  - name: iia
    title: Hausman-McFadden Test (IIA)
    type: Table
    rows: 0
    columns:
      - name: category
        title: Omitted category
        type: text
      - name: chiSq
        title: X²
        type: number
        format: decimal
      - name: df
        title: df
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text
      - name: note
        title: Note
        type: text

  - name: iiaInterpretation
    title: Applied interpretation
    type: Html

  - name: goodnessOfFitGuide
    title: Goodness of fit
    type: Html

  - name: goodnessOfFit
    title: Goodness of fit
    type: Table
    rows: 0
    columns:
      - name: test
        title: Test
        type: text
      - name: statistic
        title: Statistic
        type: number
        format: decimal
      - name: df
        title: df
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: goodnessOfFitInterpretation
    title: Applied interpretation
    type: Html

  - name: discriminationGuide
    title: Pseudo-R²
    type: Html

  - name: discrimination
    title: Pseudo-R²
    type: Table
    columns:
      - name: metric
        title: Metric
        type: text
      - name: value
        title: Value
        type: number
        format: decimal

  - name: discriminationInterpretation
    title: Applied interpretation
    type: Html

  - name: classificationGuide
    title: Classification table
    type: Html

  - name: classification
    title: Observed vs predicted
    type: Table
    rows: 0
    columns:
      - name: observed
        title: Observed
        type: text

  - name: classificationInterpretation
    title: Applied interpretation
    type: Html

  - name: multicollinearityGuide
    title: Multicollinearity
    type: Html
    visible: false

  - name: multicollinearity
    title: Multicollinearity
    type: Table
    visible: false
    columns:
      - name: diagnostic
        title: Diagnostic
        type: text
      - name: item
        title: Item
        type: text
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: Value
        type: number

  - name: multicollinearityInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: correlationMatrixGuide
    title: Correlation matrix (numeric predictors)
    type: Html
    visible: false

  - name: pearsonMatrixTable
    title: Pearson correlation matrix (APA 7 format)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: dcorMatrixTable
    title: Distance correlation matrix (dCor, APA 7 format)
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var
        title: Variable
        type: text

  - name: correlationMatrixNote
    title: ' '
    type: Html
    visible: false

  - name: correlationComparisonGuide
    title: Pearson / dCor / copula entropy discordance analysis
    type: Html
    visible: false

  - name: correlationComparisonTable
    title: Pairs with a notable gap between Pearson and dCor
    type: Table
    rows: 0
    visible: false
    columns:
      - name: var1
        title: Variable 1
        type: text
      - name: var2
        title: Variable 2
        type: text
      - name: pearson
        title: Pearson r
        type: text
      - name: dcor
        title: dCor
        type: text
      - name: gap
        title: Gap (dCor − |r|)
        type: number
      - name: ce
        title: Copula entropy
        type: number
      - name: ceP
        title: p (CE)
        type: number
        format: zto,pvalue
      - name: ceSig
        title: Sig. (CE)
        type: text
      - name: flag
        title: Notable difference
        type: text

  - name: correlationComparisonInterpretation
    title: Applied interpretation
    type: Html
    visible: false

  - name: influenceGuide
    title: Influential cases
    type: Html

  - name: influence
    title: Influential cases
    type: Table
    rows: 0
    columns:
      - name: case
        title: Case
        type: integer
      - name: observed
        title: Observed category
        type: text
      - name: pearsonStat
        title: Pearson statistic
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue

  - name: influenceInterpretation
    title: Applied interpretation
    type: Html

  - name: influencePlot
    title: Pearson residual by case
    type: Image
    width: 560
    height: 320
    renderFun: .plotInfluence
    clearWith:
      - dep
      - covs
      - factors
      - plotStyle
      - plotPalette
      - influenceLabelMode
      - influenceShowThreshold
      - reportLang

  - name: coefficientsGuide
    title: Coefficients and odds ratios (by category)
    type: Html

  - name: coefficients
    title: Coefficients and odds ratios
    type: Table
    rows: 0
    columns:
      - name: predictor
        title: Predictor
        type: text
      - name: category
        title: Category
        type: text
      - name: or
        title: OR
        type: number
        format: decimal
      - name: ciLower
        title: 95% CI lower
        type: number
        format: decimal
      - name: ciUpper
        title: 95% CI upper
        type: number
        format: decimal
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - name: pSig
        title: Sig.
        type: text

  - name: coefficientsInterpretation
    title: Applied interpretation
    type: Html

  - name: notes
    title: Notes and recommendation
    type: Html
