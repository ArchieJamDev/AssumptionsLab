title: Related Groups
name: relatedCheck
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    suggested:
      - continuous
    children:
      - type: TargetLayoutBox
        label: Related Measurements
        children:
          - type: VariablesListBox
            name: measures
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: CollapseBox
    label: Diagnostic Plots
    collapsed: true
    children:
      - type: CheckBox
        name: showProfilePlot
      - type: CheckBox
        name: showDifferencePlots
      - type: CheckBox
        name: showNormalityPlots
  - type: CollapseBox
    label: General Plot Style
    collapsed: true
    children:
      - type: ComboBox
        name: plotStyle
      - type: ComboBox
        name: plotPalette
