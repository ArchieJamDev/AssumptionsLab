title: Multinomial Logistic Regression
name: multCheck
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable (nominal, 3+ levels)
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Numeric Predictors
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
      - type: TargetLayoutBox
        label: Categorical Predictors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: CollapseBox
    label: Diagnostic Plots
    collapsed: true
    children:
      - type: CheckBox
        name: showPlots
  - type: CollapseBox
    label: 'Plots: Linearity in the Multinomial Logit'
    collapsed: true
    children:
      - type: CheckBox
        name: linShowPlots
      - type: ComboBox
        name: linSmoother
      - type: TextBox
        name: linBins
        format: number
  - type: CollapseBox
    label: 'Plots: Influence'
    collapsed: true
    children:
      - type: CheckBox
        name: influenceShowPlots
      - type: ComboBox
        name: influenceLabelMode
      - type: CheckBox
        name: influenceShowThreshold
  - type: CollapseBox
    label: General Plot Style
    collapsed: true
    children:
      - type: ComboBox
        name: plotStyle
      - type: ComboBox
        name: plotPalette
